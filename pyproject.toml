[project]
name = "moyung"
version = "0.1.0"
description = "Tools for LLM agents to understand raw Excel and build ETL pipelines."
requires-python = ">=3.12"
dependencies = [
    "python-calamine>=0.9",
    "openpyxl>=3.1",
    "duckdb>=1.1",
    "pydantic>=2",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2",
]

[dependency-groups]
dev = [
    "mcp>=2",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moyung*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["sample: needs the real BALANSITAS file via MOYUNG_SAMPLE"]

[tool.ruff.lint.per-file-ignores]
"tests/test_quality.py" = ["E501"]
"tests/test_state.py" = ["E501"]
